event_listener_port = 10000

# source_stream = "ndi://172.24.36.133"
ndi_source_name = "pc1"
ndi_timeout_ms = 1000
source_stream = "elgato:///dev/video0"
capture_width = 1920
capture_height = 1080
capture_fps = 240
capture_fourcc = "MJPG"
capture_timeout_ms = 2000

screen_width = 2560
screen_height = 1440
region_left = 864
region_top = 444
region_width = 192
region_height = 192

model_provider = "openvino"
model_path = "/app/assets/best.onnx"
model_input_size = 256
model_conf_body = 0.5
model_conf_head = 0.1
model_iou = 0.6
intra_threads = 1

openvino_cache_dir = "/app/assets"
openvino_device_type = "CPU"

game_sens = 0.38
# FOV ngang của game, độ.
game_hfov = 103.0
# Độ xoay mỗi count ở sensitivity 1 — hằng số của engine.
# 1.0 là giá trị ĐO ĐƯỢC trong game: mỗi count xoay đúng game_sens độ.
game_yaw = 1.0
# Hệ số bù thêm, nhân cuối cùng. Để 1.0 trừ khi game của bạn có
# hằng số yaw khác. Xem mục Calibrating aim_scale trong README.
aim_scale = 1.0

esp_button_1_profile = 0
esp_button_2_profile = 1

[mouse]
# Name picks the backend that gets loaded.
device = "makcu"
port = "/dev/ttyACM0"
baud = 4000000
# Read the physical mouse's buttons back off the link.
listen = false
dpi = 1000.0

[[profile]]
name = "tracking"
scale_min_zone = 0.85

[[profile]]
name = "flick"
scale_min_zone = 0.85
aim_mode = "horizon"
